command: [
  "python",
  "app.py"
]
env:
  - name: 'USE_STUB_LLM'
    value: 'false'
  - name: 'DATABRICKS_HOST'
    value: 'https://dbc-3b4bc42a-bf11.cloud.databricks.com'
  - name: 'DATABRICKS_OAUTH_SCOPE'
    value: 'all-apis'
  - name: 'LLM_MODEL_NAME'
    value: 'databricks-claude-sonnet-4-5'
  - name: 'LLM_MAX_TOKENS'
    value: '4000'
  - name: 'LLM_CACHE_ENABLED'
    value: 'true'
  - name: 'DATABASE_URL'
    value: 'sqlite+aiosqlite:////app/python/source_code/qbr_intelligence.db'
  - name: 'VECTOR_BACKEND'
    value: 'faiss'
  - name: 'RETRIEVAL_INCLUDE_DOCUMENT_PATH'
    value: 'false'
  - name: 'FAISS_DIR'
    value: '/app/python/source_code/data/faiss'
  - name: 'FAISS_AUTO_BUILD'
    value: 'false'
  - name: 'FAISS_REBUILD_ON_STARTUP'
    value: 'true'
  - name: 'OUTPUT_PROTOCOL'
    value: 'websocket'
  - name: 'LOG_LEVEL'
    value: 'DEBUG'
